name: TrainAiCad regression
on:
  push:
    paths:
      - 'AGENTS.md'
      - 'AI_ENTRYPOINT.md'
      - 'skills/**'
      - 'references/**'
      - 'regression/**'
      - 'tools/**'
      - 'tests/**'
      - 'services/trainaicad-mcp/**'
      - 'requirements.txt'
      - '.github/workflows/dxf-export-tests.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'AI_ENTRYPOINT.md'
      - 'skills/**'
      - 'references/**'
      - 'regression/**'
      - 'tools/**'
      - 'tests/**'
      - 'services/trainaicad-mcp/**'
      - 'requirements.txt'
      - '.github/workflows/dxf-export-tests.yml'
jobs:
  serializer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: Production rule regressions V4.19-V4.22
        run: |
          python regression/tools/check_520929_25_v419.py
          python regression/tools/check_v420_source_mech.py
          python regression/tools/check_520930_10_v422.py

  mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: services/trainaicad-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/trainaicad-mcp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r ../../requirements.txt
      - run: npm ci
      - run: npm run doctor
      - run: npm run check
      - run: npm run test:gate
      - run: npm run test:e2e
