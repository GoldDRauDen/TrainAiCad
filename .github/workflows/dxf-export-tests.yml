name: TrainAiCad CAD production regression
on:
  push:
    paths:
      - 'CLAUDE.md'
      - '.claude/**'
      - 'JOB_CARD.md'
      - 'README.md'
      - 'rules/**'
      - 'data/**'
      - 'regression/**'
      - 'tools/**'
      - 'tests/**'
      - 'templates/**'
      - 'examples/**'
      - 'requirements.txt'
      - 'luan_app/**'
      - '.github/workflows/dxf-export-tests.yml'
  pull_request:
    paths:
      - 'CLAUDE.md'
      - '.claude/**'
      - 'JOB_CARD.md'
      - 'README.md'
      - 'rules/**'
      - 'data/**'
      - 'regression/**'
      - 'tools/**'
      - 'tests/**'
      - 'templates/**'
      - 'examples/**'
      - 'requirements.txt'
      - 'luan_app/**'
      - '.github/workflows/dxf-export-tests.yml'
jobs:
  serializer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: Rule-card byte benchmark
        run: python tools/benchmark_rule_routes.py
  luan-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r luan_app/requirements.txt
      - run: python -m pytest luan_app/tests -q
