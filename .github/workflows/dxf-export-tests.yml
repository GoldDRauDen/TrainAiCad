name: TrainAiCad CAD production regression
on:
  push:
    paths:
      - 'AGENTS.md'
      - 'AI_BOOTSTRAP.md'
      - 'AI_ENTRYPOINT.md'
      - 'JOB_CARD.md'
      - 'SKILL.md'
      - 'QA_ENTRYPOINT.md'
      - 'README.md'
      - 'docs/**'
      - 'skills/**'
      - 'references/**'
      - 'regression/**'
      - 'tools/**'
      - 'tests/**'
      - 'templates/**'
      - 'requirements.txt'
      - '.github/workflows/dxf-export-tests.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'AI_BOOTSTRAP.md'
      - 'AI_ENTRYPOINT.md'
      - 'JOB_CARD.md'
      - 'SKILL.md'
      - 'QA_ENTRYPOINT.md'
      - 'README.md'
      - 'docs/**'
      - 'skills/**'
      - 'references/**'
      - 'regression/**'
      - 'tools/**'
      - 'tests/**'
      - 'templates/**'
      - 'requirements.txt'
      - '.github/workflows/dxf-export-tests.yml'
jobs:
  serializer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: Rule coverage and stage benchmark
        run: |
          python tools/audit_rule_coverage.py
          python tools/benchmark_rule_routes.py
          python tools/audit_rule_duplicates.py
