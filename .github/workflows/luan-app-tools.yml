name: LuanAppTools
on:
  push:
    paths: ['LuanAppTools/**', '.github/workflows/luan-app-tools.yml']
  pull_request:
    paths: ['LuanAppTools/**', '.github/workflows/luan-app-tools.yml']
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r LuanAppTools/requirements-dev.txt
      - run: python -m pytest LuanAppTools/tests -q
      - name: Parse PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/LuanAppTools/Start-LuanAppTools.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { $parseErrors | Format-List; exit 1 }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: LuanAppTools/frontend/package-lock.json
      - run: npm ci
        working-directory: LuanAppTools/frontend
      - run: npm test && npm run build
        working-directory: LuanAppTools/frontend
