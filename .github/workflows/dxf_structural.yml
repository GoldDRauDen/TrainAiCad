name: TrainAiCad synthetic DXF checks
on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
jobs:
  dxf-structural:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install structural test dependencies
        run: python -m pip install -r requirements.txt
      - name: Structural serialization and packaging tests (NOT PDF certification)
        run: python -m pytest tests/ -q
