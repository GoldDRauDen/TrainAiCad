# Slit lead value (vòi dẫn, LeadVal = offset of BOTH meeting edges toward the void) by material group and thickness.
# Source: user-approved Book1.xlsx / 一覧表2026.07.30 column G (外周ピアス 長); user confirmed 2026-10-21 that column G is the
# LeadVal source.  Samples that prove the mapping: 055958 (t5 -> 6) and the 3 / 6 values of earlier jobs.
# Intervals follow the sheet: B = Min, C = Max; a blank Min after another row starts just above the previous Max
# (min_open: true); a blank Max runs up to (not including) the next row's Min.
# Thickness outside every row (a gap, e.g. SS 3.2 < t < 4) is NOT interpolated: lead_val raises LEAD_VALUE_UNPROVED (local FLAG).
# shape HOOK (曲, SS/SUS/AL t >= 19) is the hook pierce (10 | R3 | 7); user 2026-10-21: t > 16 does not occur, FLAG, never draw it.
# CU_BRASS 5 < t < 6 uses the t6 row (approved L10); t > 6 has no row.  OTHER (他) uses the SUS/他 rows (same as laser R routing).
