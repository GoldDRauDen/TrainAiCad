# Research staging: native ChatGPT file params + Auth0 OAuth. Supabase is storage only.
# Blueprint Path: services/trainaicad-mcp/deploy/render.yaml
services:
  - type: web
    name: trainaicad-mcp-research
    runtime: docker
    plan: free
    autoDeploy: false
    dockerContext: .
    dockerfilePath: ./services/trainaicad-mcp/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TRAINAICAD_AUTH_MODE
        value: auth0
      - key: TRAINAICAD_AUTH0_ISSUER
        sync: false
      - key: TRAINAICAD_AUTH0_AUDIENCE
        sync: false
      - key: TRAINAICAD_AUTH0_OWNER_SUB
        sync: false
      - key: TRAINAICAD_ARTIFACT_SECRET
        generateValue: true
      - key: TRAINAICAD_REQUIRE_DURABLE
        value: "1"
      - key: TRAINAICAD_PUBLIC_URL
        sync: false
      - key: TRAINAICAD_SOURCE_COMMIT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TRAINAICAD_STORAGE_BUCKET
        value: trainaicad-private
      - key: TRAINAICAD_STORAGE_NAMESPACE
        value: research-owner
